<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sazón SPS - Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fafaf9; }
        
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            height: 40vh;
            max-height: 400px;
            min-height: 250px;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-btn.active {
            border-bottom: 2px solid #d97706;
            color: #d97706;
            font-weight: 600;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col h-screen">

    <header class="bg-white shadow-sm border-b border-stone-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🍲</span>
                <h1 class="font-bold text-xl text-stone-800">Sazón SPS</h1>
            </div>
            <nav class="flex space-x-1 overflow-x-auto no-scrollbar">
                <button onclick="app.switchTab('guia')" id="tab-guia" class="tab-btn active px-3 py-2 text-sm text-stone-500 hover:text-stone-800 whitespace-nowrap">📚 Guía</button>
                <button onclick="app.switchTab('pos')" id="tab-pos" class="tab-btn px-3 py-2 text-sm text-stone-500 hover:text-stone-800 whitespace-nowrap">🛒 Facturación</button>
                <button onclick="app.switchTab('inventario')" id="tab-inventario" class="tab-btn px-3 py-2 text-sm text-stone-500 hover:text-stone-800 whitespace-nowrap">📦 Inventario</button>
                <button onclick="app.switchTab('contabilidad')" id="tab-contabilidad" class="tab-btn px-3 py-2 text-sm text-stone-500 hover:text-stone-800 whitespace-nowrap">📊 Contabilidad</button>
            </nav>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 max-w-7xl mx-auto w-full">
        
        <div id="view-guia" class="block animate-fade-in">
            <div class="mb-8">
                <h2 class="text-3xl font-bold mb-2">Guía para Formalizar en SPS</h2>
                <p class="text-stone-600">Pasos exactos para inscribir tu negocio de comidas y acceder a créditos y apps de delivery.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-1
